<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Multi-Agent Platform</title>
<style>body{font-family:system-ui;max-width:760px;margin:32px auto;padding:0 16px;background:#0b1730;color:#eef}a{color:#9cf}textarea,input,select,button{font-size:15px;padding:8px;border-radius:6px;border:1px solid #345;background:#13234a;color:#eef}textarea{width:100%;box-sizing:border-box}button{cursor:pointer;background:#2b5bd7}pre{background:#13234a;padding:12px;white-space:pre-wrap;border-radius:6px;max-height:480px;overflow:auto}.row{display:flex;gap:8px;margin:8px 0}</style></head>
<body><h1>Multi-Agent Platform</h1><p>A registry of AI agents with an LLM router that dispatches each task to the best one. Create your own agent, run tasks, and watch per-agent metrics.</p>
<div class=row><select id=ep><option value="0">POST /api/run — run (auto-routed)</option><option value="1">POST /api/run — run (auto-routed)</option><option value="2">POST /api/agents — create an agent</option><option value="3">POST /api/run — run a specific agent</option><option value="4">GET /api/agents — list agents</option><option value="5">GET /api/metrics — metrics</option></select><button id=go>Send</button></div>
<textarea id=bd rows=5></textarea><p style="opacity:.7;font-size:13px">Edit the JSON body and press Send. Rate limited to keep this demo on the free tier. Source on <a href="https://github.com/braylo777/agent-09-multi-agent-platform">GitHub</a>.</p>
<h3>Response</h3><pre id=out></pre>
<script>
const S=localStorage.sid||(localStorage.sid=Math.random().toString(36).slice(2,10));
const E=[{"label": "run (auto-routed)", "method": "POST", "path": "/api/run", "body": {"task": "Write a Python function that dedupes a list while keeping order."}}, {"label": "run (auto-routed)", "method": "POST", "path": "/api/run", "body": {"task": "Should I charge $99 or $149/month for an AI receptionist for dentists?"}}, {"label": "create an agent", "method": "POST", "path": "/api/agents", "body": {"name": "tweet-smith", "description": "Turns any idea into a viral X/Twitter thread", "instructions": "You write 5-tweet threads: hook, 3 value tweets, CTA. Under 280 chars each."}}, {"label": "run a specific agent", "method": "POST", "path": "/api/run", "body": {"task": "Why serverless AI agents are cheap to run", "agent": "copywriter"}}, {"label": "list agents", "method": "GET", "path": "/api/agents"}, {"label": "metrics", "method": "GET", "path": "/api/metrics"}];
const fill=()=>{const x=E[ep.value];bd.value=x.body?JSON.stringify(x.body,null,2).replaceAll("{{session}}",S):"";bd.disabled=x.method==="GET"};
ep.onchange=fill;fill();
go.onclick=async()=>{const x=E[ep.value];out.textContent="working…";const t0=Date.now();
try{const r=await fetch(x.path.replaceAll("{{session}}",S),x.method==="GET"?{}:{method:"POST",headers:{"content-type":"application/json"},body:bd.value});
out.textContent=`HTTP ${r.status} · ${Date.now()-t0} ms\n\n`+JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=String(e)}};
</script></body></html>
